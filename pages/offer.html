<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juniper Salon · Your appointment offer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="center">
      <div class="narrow">
        <div class="brand"><span class="brand-mark">J</span><span class="brand-name">Juniper Salon</span></div>
        <section class="card offer-card" id="offer" aria-live="polite">
          <p class="muted">Loading your offer…</p>
        </section>
        <p class="footer-note small" id="stop-area" hidden>
          <button class="btn-link" id="stop">Stop sending me offers</button>
        </p>
      </div>
    </main>
    <script src="/common.js"></script>
    <script src="/offer.js"></script>
  </body>
</html>
